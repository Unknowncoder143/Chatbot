
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebVibe AI Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0f17;color:#edf2ff;font:15px Arial,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{padding:17px 20px;background:#141b26;border-bottom:1px solid #29354a;display:flex;align-items:center;gap:12px}
.logo{background:linear-gradient(135deg,#4f8cff,#8957ff);padding:12px;border-radius:13px}
header h3{margin:0;font-size:17px}
header small{display:block;color:#9aa9c0;margin-top:5px}
#messages{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:85%;padding:13px 16px;border-radius:17px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{align-self:flex-start;background:#182131;border:1px solid #29354a}
.user{align-self:flex-end;background:#356fe0;color:white}
form{padding:15px;display:flex;gap:10px;background:#141b26;border-top:1px solid #29354a}
textarea{flex:1;resize:none;max-height:120px;background:#0b0f17;border:1px solid #34445e;border-radius:15px;padding:14px;color:white;font:inherit;outline:none}
textarea:focus{border-color:#4f8cff}
button{border:0;border-radius:13px;background:#4f8cff;color:white;padding:0 20px;font-size:20px;cursor:pointer}
button:disabled{opacity:.5}
footer{text-align:center;color:#738198;font-size:11px;padding:0 10px 10px;background:#141b26}
</style>
</head>
<body>
<header>
  <div class="logo">✦</div>
  <div><h3>WebVibe AI</h3><small id="status">Your AI assistant</small></div>
</header>

<main id="messages">
  <div class="msg bot">Hey there! 👋 Welcome to WebVibe AI. What can I help you with today?</div>
</main>

<form id="form">
  <textarea id="input" rows="1" maxlength="4000" placeholder="Message WebVibe AI..." required></textarea>
  <button id="send" type="submit" aria-label="Send message">➤</button>
</form>
<footer>Powered by WebVibe AI</footer>

<script>
const API="https://llmaichatbot.netlify.app/.netlify/functions/chat";
const WIDGET_ID="demo123";
const messages=document.getElementById("messages");
const input=document.getElementById("input");
const send=document.getElementById("send");
const status=document.getElementById("status");

function add(text,who){
  const el=document.createElement("div");
  el.className="msg "+who;
  el.textContent=text;
  messages.appendChild(el);
  messages.scrollTop=messages.scrollHeight;
  return el;
}

document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const question=input.value.trim();
  if(!question||send.disabled)return;
  add(question,"user");
  input.value="";
  send.disabled=true;
  status.textContent="Thinking...";
  const waiting=add("Thinking…","bot");
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),30000);

  try{
    const res=await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({widgetId:WIDGET_ID,question}),
      signal:controller.signal
    });
    const data=await res.json();
    waiting.remove();
    if(!res.ok)throw Error(data.error||"Request failed: "+res.status);
    if(typeof data.reply!=="string")throw Error("Invalid AI response.");
    add(data.reply,"bot");
    status.textContent="Ready to help";
  }catch(err){
    waiting.remove();
    add(err.name==="AbortError"?"Request timed out. Please try again.":err.message||"Connection failed. Check your backend and CORS settings.","bot");
    status.textContent="Connection issue";
  }finally{
    clearTimeout(timer);
    send.disabled=false;
    input.focus();
  }
});

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    document.getElementById("form").requestSubmit();
  }
});
input.addEventListener("input",()=>{
  input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,120)+"px";
});
</script>
</body>
</html>
