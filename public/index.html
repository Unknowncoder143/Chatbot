
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f17">
<title>WebVibe AI Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0f17;
  color: #edf2ff;
  font: 15px Arial, sans-serif;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 17px 20px;
  background: #141b26;
  border-bottom: 1px solid #29354a;
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  background: linear-gradient(135deg, #4f8cff, #8957ff);
  padding: 12px;
  border-radius: 13px;
}

header h3 {
  margin: 0;
  font-size: 17px;
}

header small {
  display: block;
  color: #9aa9c0;
  margin-top: 5px;
}

#messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.msg {
  max-width: 85%;
  padding: 13px 16px;
  border-radius: 17px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.bot {
  align-self: flex-start;
  background: #182131;
  border: 1px solid #29354a;
}

.user {
  align-self: flex-end;
  background: #356fe0;
  color: white;
}

form {
  padding: 15px;
  display: flex;
  gap: 10px;
  background: #141b26;
  border-top: 1px solid #29354a;
}

textarea {
  flex: 1;
  min-width: 0;
  resize: none;
  max-height: 120px;
  background: #0b0f17;
  border: 1px solid #34445e;
  border-radius: 15px;
  padding: 14px;
  color: white;
  font: inherit;
  outline: none;
}

textarea:focus {
  border-color: #4f8cff;
}

button {
  flex-shrink: 0;
  border: 0;
  border-radius: 13px;
  background: #4f8cff;
  color: white;
  padding: 0 20px;
  font-size: 20px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

@media (max-width: 480px) {
  header {
    padding: 14px;
  }

  #messages {
    padding: 15px;
  }

  form {
    padding: 10px;
  }

  .msg {
    max-width: 92%;
  }

  button {
    padding: 0 16px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">✦</div>
  <div>
    <h3>WebVibe AI</h3>
    <small id="status">Your AI assistant</small>
  </div>
</header>

<main id="messages" aria-live="polite">
  <div class="msg bot">
    Hey there! 👋 Welcome to WebVibe AI. What can I help you with today?
  </div>
</main>

<form id="form">
  <textarea
    id="input"
    rows="1"
    maxlength="4000"
    placeholder="Message WebVibe AI..."
    aria-label="Message WebVibe AI"
    required></textarea>

  <button
    id="send"
    type="submit"
    aria-label="Send message">➤</button>
</form>

<script>
const API = "https://llmaichatbot.netlify.app/.netlify/functions/chat";
const WIDGET_ID = "demo123";

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const send = document.getElementById("send");
const status = document.getElementById("status");
const form = document.getElementById("form");

function add(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
  return el;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const question = input.value.trim();

  if (!question || send.disabled) return;

  add(question, "user");
  input.value = "";
  input.style.height = "auto";

  send.disabled = true;
  status.textContent = "Thinking...";

  const waiting = add("Thinking…", "bot");
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 30000);

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        widgetId: WIDGET_ID,
        question: question
      }),
      signal: controller.signal
    });

    let data;

    try {
      data = await res.json();
    } catch {
      throw new Error("The server returned an invalid response.");
    }

    if (!res.ok) {
      throw new Error(data.error || "Request failed: " + res.status);
    }

    if (typeof data.reply !== "string") {
      throw new Error("Invalid AI response.");
    }

    waiting.remove();
    add(data.reply, "bot");
    status.textContent = "Ready to help";

  } catch (err) {
    waiting.remove();

    let message;

    if (err.name === "AbortError") {
      message = "Request timed out. Please try again.";
    } else if (err instanceof TypeError) {
      message = "Unable to connect. Please check your internet connection and backend settings.";
    } else {
      message = err.message || "Something went wrong. Please try again.";
    }

    add(message, "bot");
    status.textContent = "Connection issue";

  } finally {
    clearTimeout(timer);
    send.disabled = false;
    input.focus();
  }
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});
</script>

</body>
</html>
